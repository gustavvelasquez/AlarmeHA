criar:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: alarmeha
    timeout:
      required: false
      default: 45
      selector:
        number:
          min: 10
          max: 300
          unit_of_measurement: s
    ref:
      required: true
      example: usuario_aula
      selector:
        text:
    hora:
      required: true
      selector:
        number:
          min: 0
          max: 23
          mode: box
    minuto:
      required: true
